version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # If SITE_DOMAIN is missing in .env, it falls back to 'localhost'
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost} 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-net

  davhi-api:
    build: ./api
    container_name: davhi-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development} # Falls back to development locally
    networks:
      - app-net
    
  davhi-portal:
    build: ./portal
    container_name: davhi-portal
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development} # Falls back to development locally
    networks:
      - app-net

volumes:
  caddy_data:
  caddy_config:

networks:
  app-net:
    driver: bridge
