name: Sync API Docs

on:
  push:
    branches: [main]
    paths:
      - 'api/src/**'
      - 'api/package.json'
      - 'api/package-lock.json'
      - '.github/workflows/api-docs-sync.yml'
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read # we only write to the *docs* repo, via DOCS_REPO_TOKEN

concurrency:
  group: api-docs-sync
  cancel-in-progress: true

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout server repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export OpenAPI spec
        run: npm run export:schema

      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: TeamAudiaptic/audiaptic-docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Copy spec into docs repo
        run: |
          mkdir -p ../docs-repo/openapi
          cp openapi.json ../docs-repo/openapi/openapi.json

      - name: Commit and push
        working-directory: docs-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json
          if git diff --cached --quiet; then
            echo "API spec unchanged, nothing to push."
          else
            git commit -m "docs(api): sync openapi.json from audiaptic-server@${GITHUB_SHA::7}"
            git push
          fi
